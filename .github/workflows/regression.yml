name: Regression Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run regression scripts
        run: script/verify_regressions.sh

      - name: Build and test TokenBar
        run: |
          xcodebuild \
            -project TokenBar.xcodeproj \
            -scheme TokenBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            test
